<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (v instanceof Error) return v.stack || (v.name + ': ' + v.message);
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (val && typeof val === 'object') {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          return val;
        });
      } catch (_) { try { return String(v); } catch (e2) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = { sentinel: S, level: level, args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }), ts: Date.now(), url: location.href };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && e.error.stack) || e.message || 'Error';
      post('error', [msg], { kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      post('error', [String(e.reason)], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Questora</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <link rel="stylesheet" href="/tailwind.css">
  <script src="/usernode-bridge/v1/bridge.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <!-- Desktop top bar -->
  <header class="hidden md:block fixed top-0 inset-x-0 z-40 bg-zinc-950/90 border-b border-zinc-800">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center gap-6">
      <a href="/" class="flex items-center gap-2 font-bold text-lg text-violet-400">Questora</a>
      <nav class="flex items-center gap-1 text-sm" id="desktop-nav"></nav>
      <div class="ml-auto flex items-center gap-3">
        <button id="notif-btn" class="relative p-2 rounded-lg hover:bg-zinc-800 text-zinc-400" aria-label="Notifications">
          <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 2a6 6 0 0 0-6 6c0 2.1-.6 3.6-1.3 4.6-.3.5 0 1.4.7 1.4h13.2c.7 0 1-.9.7-1.4C16.6 11.6 16 10.1 16 8a6 6 0 0 0-6-6ZM8 16a2 2 0 1 0 4 0H8Z"/></svg>
          <span id="notif-badge" class="hidden absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-violet-600 text-white text-[10px] font-bold flex items-center justify-center"></span>
        </button>
        <a id="nav-profile-desktop" href="/me" class="text-sm text-zinc-300 hover:text-white">Profile</a>
      </div>
    </div>
  </header>

  <!-- Mobile top bar -->
  <header class="md:hidden sticky top-0 z-40 bg-zinc-950/90 backdrop-blur border-b border-zinc-800">
    <div class="px-4 h-12 flex items-center justify-between">
      <a href="/" class="font-bold text-violet-400">Questora</a>
      <button id="notif-btn-mobile" class="relative p-2 rounded-lg active:bg-zinc-800 text-zinc-400 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Notifications">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 2a6 6 0 0 0-6 6c0 2.1-.6 3.6-1.3 4.6-.3.5 0 1.4.7 1.4h13.2c.7 0 1-.9.7-1.4C16.6 11.6 16 10.1 16 8a6 6 0 0 0-6-6ZM8 16a2 2 0 1 0 4 0H8Z"/></svg>
        <span id="notif-badge-mobile" class="hidden absolute top-1 right-1 min-w-[16px] h-[16px] px-0.5 rounded-full bg-violet-600 text-white text-[9px] font-bold flex items-center justify-center"></span>
      </button>
    </div>
  </header>

  <main id="app" class="max-w-6xl mx-auto px-4 md:px-6 pt-4 md:pt-20 pb-24 md:pb-12" style="padding-bottom:calc(6rem + var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px)))"></main>

  <!-- Mobile bottom nav -->
  <nav id="bottom-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-zinc-950/95 backdrop-blur border-t border-zinc-800" style="padding-bottom:var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px))">
    <div class="flex justify-around h-16" id="bottom-nav-items"></div>
  </nav>

  <div id="toast-holder"></div>

  <script src="/api.js"></script>
  <script src="/components.js"></script>
  <script src="/views.js"></script>
  <script src="/app.js"></script>
</body>
</html>
